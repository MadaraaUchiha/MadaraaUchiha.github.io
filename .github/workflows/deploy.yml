# Build the site and publish it to GitHub Pages.
#
# The repository holds code, not corpus: fatwas.json is a Release asset, and
# citations.json, stats.json and the 1,675 pre-rendered pages are built here on
# every deploy. That keeps the repository small enough to clone in seconds and
# means the published site is always rebuilt from the scripts in this commit.
#
# Before this can run:
#   1. Settings -> Pages -> Source: "GitHub Actions"
#   2. Create a release tagged `corpus` with fatwas.json attached as an asset:
#        gh release create corpus web/data/fatwas.json --title "Corpus"
#      To publish a new corpus later:
#        gh release upload corpus web/data/fatwas.json --clobber
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tells us the URL the site will actually be served from — project site,
      # user site or custom domain — so the canonical tags, Open Graph tags,
      # sitemap and robots.txt are all correct without anyone editing a constant.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch the corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/corpus
          gh release download corpus --pattern fatwas.json --dir data/corpus
          ls -la data/corpus

      # Applies corrections/, then writes the corrected corpus the site serves
      # alongside the citations. Fails the deploy if a correction no longer
      # applies -- the live site stays as it was rather than quietly dropping
      # someone's fix.
      - name: Apply corrections, build citations and stats
        run: python scripts/build_web_data.py

      - name: Pre-render the fatwa pages, the sitemap and robots.txt
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/prerender.py

      - name: Check nothing is missing, and nothing is published that should not be
        run: |
          test -f web/index.html
          test -f web/search.html
          test -f web/sitemap.xml
          test -f web/robots.txt
          test -f web/data/citations.json
          test -f web/data/search-core.json
          test -f web/data/search-rest.json
          # The whole corpus is a build artefact. If it ever lands in web/ it
          # adds 29 MB to the site that no page asks for.
          test ! -f web/data/fatwas.json
          pages=$(find web/f -name '*.html' | wc -l)
          echo "pre-rendered pages: $pages"
          test "$pages" -gt 1000
          echo "published site: $(du -sh web | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
