<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand mark: the ornate opening bracket, in the system's accent.
       Same glyph the masthead carries.
       No ground behind it: the plate here was #f3f2f2, which is only right on a
